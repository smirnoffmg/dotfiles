# vim:set ft=tmux:
# Charging power module: charger input and battery flow, refreshed every status-interval.
# Own file like catppuccin's status/*.conf: MODULE_NAME must still hold "power" when the
# deferred source of status_module.conf runs.
%hidden MODULE_NAME="power"

set -ogq "@catppuccin_${MODULE_NAME}_icon" "󱐋 "
set -ogqF "@catppuccin_${MODULE_NAME}_color" "#{E:@thm_yellow}"
set -ogq "@catppuccin_${MODULE_NAME}_text" " #(~/.config/tmux/charge-power.sh)"

source ~/.config/tmux/plugins/catppuccin/tmux/utils/status_module.conf
