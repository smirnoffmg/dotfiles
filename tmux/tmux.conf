set -g mouse on
set -s default-terminal "tmux-256color"
set -as terminal-features ",alacritty*:RGB"
set -sg escape-time 10
set -g focus-events on

# common

unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

bind r source-file ~/.config/tmux/tmux.conf

# -- display -------------------------------------------------------------------

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

setw -g automatic-rename on
set -g status-interval 1


# List of plugins
# TPM-managed plugins (installed as git submodules)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# tmux-continuum: autosave only. Auto-restore stays off — it replays whatever the
# last snapshot held, which resurrects sessions closed on purpose. Restore is manual:
# prefix + Ctrl-r (resurrect). 1 min instead of the default 15 keeps that snapshot fresh.
set -g @continuum-save-interval '1'
set -g @continuum-restore 'off'

# -- session management ---------------------------------------------------------

# don't detach when the current session dies (e.g. last window closed via C-d) —
# switch to the most recently active remaining session instead
set -g detach-on-destroy off

bind-key s choose-tree -Zs
bind-key N command-prompt -p "New session:" "new-session -s '%%'"

# Configure the catppuccin plugin
# Note: Catppuccin is loaded manually (as recommended by the plugin authors)
# but managed as a git submodule for version control
set -g @catppuccin_flavor "macchiato"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text "#{?#{==:#{pane_title},#{host}},#{pane_current_command}, #{=/20/…:pane_title}}"
set -g @catppuccin_window_current_text "#{?#{==:#{pane_title},#{host}},#{pane_current_command}, #{=/20/…:pane_title}}"

# Load catppuccin manually (recommended installation method)
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"

# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_session}"
set -ag status-right " #{continuum_status}"


# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
