repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-merge-conflict
      - id: detect-private-key

  # Credential leak detection using detect-secrets
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        # Exclude lock files that commonly have false positives
        exclude: |
          (?x)^(
            nvim/lazy-lock\.json
          )$

  # Additional credential scanning with gitleaks (more comprehensive)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
        # Scan staged files for secrets, use config file for exclusions
        args:
          ["--staged", "--no-banner", "--verbose", "--config", ".gitleaks.toml"]
      # The staged scan is empty in an --all-files run, so audits get a
      # full-history scan instead: pre-commit run --hook-stage manual gitleaks-history
      - id: gitleaks
        alias: gitleaks-history
        name: gitleaks (full git history)
        entry: gitleaks git --no-banner --config .gitleaks.toml .
        stages: [manual]

  # Formatting for YAML/JSON/Markdown. rbubley fork: the pre-commit mirror is
  # archived upstream, frozen at a prettier 4 alpha.
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.6
    hooks:
      - id: prettier
        types_or: [yaml, json, markdown]

  # Lua formatting — same stylua.toml the manual `stylua nvim/` command uses.
  # stylua-github downloads its own prebuilt binary, so it needs nothing
  # installed locally or in CI.
  - repo: https://github.com/JohnnyMorganz/StyLua
    rev: v2.5.2
    hooks:
      - id: stylua-github

  # TOML formatting for alacritty.toml, .gitleaks.toml, stylua.toml.
  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-format

  # Shell script formatting. Excludes:
  #   - path.zsh, .zshrc: zsh-only syntax shfmt's parser rejects outright
  #     (RC_EXPAND_PARAM "$^array", glob qualifiers "(N-/)", "${(%):-%n}"-
  #     style parameter flags) — verified it fails to parse them, not just
  #     reformats them differently.
  #   - .p10k.zsh: generated by `p10k configure` in its own comment-aligned
  #     style; reformatting it would just fight the wizard every time it's
  #     regenerated (same reason lazy-lock.json is excluded above).
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt
        args: ["--write", "--indent", "2"]
        exclude: |
          (?x)^(
            zsh/path\.zsh|
            zsh/\.zshrc|
            zsh/\.p10k\.zsh
          )$
